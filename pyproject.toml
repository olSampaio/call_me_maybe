[project]
name = "call-me-maybe"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "torch",
    "numpy",
    "pydantic",
]

[dependency-groups]
dev = [
    "flake8",
    "mypy",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
llm-sdk = { path = "llm_sdk" }
torch = { index = "pytorch-cpu" }

[tool.mypy]
exclude = ["^llm_sdk/", "^\\.venv/"]